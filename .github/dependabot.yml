# Dependabot version updates. Security updates are enabled separately in
# Settings > Code security. Weekly keeps noise low for a side project.
version: 2
updates:
  # Python: requirements.txt (dev/pipeline) and requirements-prod.txt (runtime)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Frontend (pnpm lockfile lives in frontend/)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile (node, python)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
